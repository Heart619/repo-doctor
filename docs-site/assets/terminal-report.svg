<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Repo Doctor terminal report</title>
  <desc id="desc">Example terminal output showing repository score and findings.</desc>
  <rect width="960" height="640" fill="#ffffff"/>
  <rect x="32" y="32" width="896" height="576" rx="12" fill="#111820"/>
  <circle cx="72" cy="72" r="10" fill="#f25f58"/>
  <circle cx="106" cy="72" r="10" fill="#f2c94c"/>
  <circle cx="140" cy="72" r="10" fill="#45bf7a"/>
  <text x="64" y="136" fill="#eaf2f8" font-family="Consolas, monospace" font-size="34" font-weight="700">Repo Doctor</text>
  <text x="64" y="190" fill="#9fb2bf" font-family="Consolas, monospace" font-size="24">Repository: /workspace/project</text>
  <text x="64" y="236" fill="#9ff2d2" font-family="Consolas, monospace" font-size="28">Score: 82/100</text>
  <text x="64" y="306" fill="#ffd36e" font-family="Consolas, monospace" font-size="24">[MEDIUM] Missing security policy</text>
  <text x="64" y="346" fill="#d8e6ef" font-family="Consolas, monospace" font-size="20">ID: missing-security-policy</text>
  <text x="64" y="386" fill="#d8e6ef" font-family="Consolas, monospace" font-size="20">Recommendation: Add SECURITY.md with reporting guidance.</text>
  <text x="64" y="456" fill="#7bdff2" font-family="Consolas, monospace" font-size="24">[LOW] Missing changelog</text>
  <text x="64" y="496" fill="#d8e6ef" font-family="Consolas, monospace" font-size="20">Recommendation: Track release notes for users.</text>
  <rect x="64" y="540" width="320" height="16" rx="8" fill="#23313b"/>
  <rect x="64" y="540" width="262" height="16" rx="8" fill="#197f71"/>
</svg>
