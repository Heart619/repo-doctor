name: Repo Doctor
description: Audit repository maintenance health.
author: Heart619

inputs:
  path:
    description: Repository path relative to the workflow workspace.
    required: false
    default: "."
  args:
    description: Extra Repo Doctor CLI arguments.
    required: false
    default: "--markdown"
  job-summary:
    description: Write a Markdown report to the GitHub Actions job summary.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Repo Doctor
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$ACTION_PATH"
        npm ci
        npm run build
    - name: Run Repo Doctor
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGET_PATH: ${{ inputs.path }}
        EXTRA_ARGS: ${{ inputs.args }}
        JOB_SUMMARY: ${{ inputs.job-summary }}
      run: |
        cd "$ACTION_PATH"
        if [ "$JOB_SUMMARY" = "false" ]; then
          node dist/cli.js "$GITHUB_WORKSPACE/$TARGET_PATH" $EXTRA_ARGS --no-job-summary
        else
          node dist/cli.js "$GITHUB_WORKSPACE/$TARGET_PATH" $EXTRA_ARGS
        fi
